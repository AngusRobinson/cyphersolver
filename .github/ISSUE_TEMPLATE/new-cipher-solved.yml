name: New cipher with solution
description: A ciphered document not yet in the ledger, with its key and decipherment.
title: "New cipher with solution: <archive, shelfmark>"
labels: [contribution, new cipher, solution]
body:
  - type: input
    id: shelfmark
    attributes:
      label: Archive, shelfmark and folio
    validations: {required: true}
  - type: input
    id: images
    attributes:
      label: Images
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Date, sender, recipient, language
  - type: textarea
    id: key
    attributes:
      label: Key
    validations: {required: true}
  - type: textarea
    id: reading
    attributes:
      label: Decipherment
      description: Line by line against the ciphertext; mark the passages you are unsure of.
    validations: {required: true}
  - type: textarea
    id: method
    attributes:
      label: How the key was obtained
    validations: {required: true}
  - type: dropdown
    id: publish
    attributes:
      label: May the reading be shown here in full?
      options:
        - yes, in full
        - note it as my unpublished solution only
    validations: {required: true}
  - type: input
    id: credit
    attributes:
      label: How to credit you
